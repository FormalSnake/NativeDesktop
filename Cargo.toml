[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# Published GPUI crates with nd's patch queue applied, written by scripts/gpui-fork.
exclude = ["crates/nd-gpui/vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nd-core = { path = "crates/nd-core" }
nd-diag = { path = "crates/nd-diag" }
nd-gpui = { path = "crates/nd-gpui" }
nd-macros = { path = "crates/nd-macros" }
nd-ui = { path = "crates/nd-ui" }
nd-backend-appkit = { path = "crates/nd-backend-appkit" }
ndshell = { path = "crates/ndshell" }
nd-automation = { path = "crates/nd-automation" }
nd-test = { path = "crates/nd-test" }
nd-os-windows = { path = "crates/nd-os-windows" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The pinned GPUI snapshot (zed@93d7456). Bumped by `scripts/gpui-fork bump`; only nd-gpui names these.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
gpui_fast = { package = "gpui-fast", version = "=0.1.7", default-features = false }
gpui_fast_platform = { package = "gpui-fast-platform", version = "=0.1.7", default-features = false }
# Same version and features as gpui-pre, so its style enums convert into these types.
taffy = { version = "0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

# gpui-fork: begin, generated by scripts/gpui-fork vendor
# gpui-fork: end
