[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# Published GPUI crates with nd's patch queue applied, written by scripts/gpui-fork.
exclude = ["crates/nd-gpui/vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nd-core = { path = "crates/nd-core" }
nd-diag = { path = "crates/nd-diag" }
nd-gesture = { path = "crates/nd-gesture" }
nd-gpui = { path = "crates/nd-gpui" }
nd-macros = { path = "crates/nd-macros" }
nd-ui = { path = "crates/nd-ui" }
nd-backend-appkit = { path = "crates/nd-backend-appkit" }
nd-backend-gpui = { path = "crates/nd-backend-gpui" }
ndshell = { path = "crates/ndshell" }
nd-automation = { path = "crates/nd-automation" }
nd-test = { path = "crates/nd-test" }
nd-theme = { path = "crates/nd-theme" }
nd-components = { path = "crates/nd-components" }
nd-virtual = { path = "crates/nd-virtual" }
nd-os-linux = { path = "crates/nd-os-linux" }
nd-os-windows = { path = "crates/nd-os-windows" }
nd-os-web = { path = "crates/nd-os-web" }
nd-update = { path = "crates/nd-update", default-features = false }
nd-config = { path = "crates/nd-config" }
nd-terminal = { path = "crates/nd-terminal" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The pinned GPUI snapshot (zed@93d7456). Bumped by `scripts/gpui-fork bump`; only nd-gpui names these.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
gpui_fast = { package = "gpui-fast", version = "=0.1.7", default-features = false }
gpui_fast_platform = { package = "gpui-fast-platform", version = "=0.1.7", default-features = false }
# Same version and features as gpui-pre, so its style enums convert into these types.
taffy = { version = "0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }
# What gpui-fast pins, for `nd-gpui/fast`.
taffy_fast = { package = "taffy", version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
# Dependencies keep file and line in backtraces but drop variable info, which is most of a debug
# build's size; workspace crates keep full debug info.
debug = "line-tables-only"

# libghostty-vt's build script compiles Ghostty in Zig's Debug mode whenever it sees debug info,
# and Debug parses output thousands of times slower.
[profile.dev.package.libghostty-vt-sys]
debug = false

# gpui-fork: begin, generated by scripts/gpui-fork vendor
[patch.crates-io]
gpui-pre = { path = "crates/nd-gpui/vendor/gpui-pre" }
gpui-fast = { path = "crates/nd-gpui/vendor/gpui-fast" }
gpui-pre-linux = { path = "crates/nd-gpui/vendor/gpui-pre-linux" }
gpui-fast-linux = { path = "crates/nd-gpui/vendor/gpui-fast-linux" }
gpui-pre-wgpu = { path = "crates/nd-gpui/vendor/gpui-pre-wgpu" }
gpui-fast-wgpu = { path = "crates/nd-gpui/vendor/gpui-fast-wgpu" }
# gpui-fork: end
