name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "bun publish --dry-run instead of publishing"
        type: boolean
        default: true

jobs:
  build-darwin-arm64:
    # macos-26: the Swift package declares tools 6.2, which older runner
    # images' default toolchain (6.1) refuses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        run: |
          curl -sL https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz | tar xJ
          echo "$PWD/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
      - name: Stage the CEF distribution
        # The chromium engine compiles in only when the dist's headers resolve
        # (ND_CEF_ROOT or the dev cache); without this step the published host
        # silently ships engine-less. Pin matches packages/nd/src/package/cef.ts.
        run: |
          mkdir -p "$HOME/.cache/nativedesktop/cef"
          curl -sL -o cef.tar.bz2 "https://cef-builds.spotifycdn.com/cef_binary_151.3.23%2Bgd211df0%2Bchromium-151.0.7922.170_macosarm64_minimal.tar.bz2"
          tar xjf cef.tar.bz2 -C "$HOME/.cache/nativedesktop/cef"
          mv "$HOME/.cache/nativedesktop/cef"/cef_binary_* "$HOME/.cache/nativedesktop/cef/151.3.23-macosarm64"
      - name: Build AppKit host
        run: ./scripts/mac/build-appkit-host.sh
      - name: Strip (local symbols only; a full strip breaks Swift reflection metadata)
        run: strip -x swift/.build/release/NDShell
      - name: Require the chromium engine in the binary
        run: strings swift/.build/release/NDShell | grep -q "Chromium Embedded"
      - uses: actions/upload-artifact@v4
        with:
          name: nd-shell
          path: swift/.build/release/NDShell
          if-no-files-found: error

  build-linux-x64:
    runs-on: ubuntu-latest
    # Deliberately NOT the Nix devshell: nix develop bakes /nix/store RPATHs
    # into the binary. The container links by soname, which is the published
    # runtime contract (docs/runtime-deps.md). ubuntu:26.04 because the GTK
    # backend calls AdwToggleGroup and the accent-color API (libadwaita 1.7+),
    # which 24.04's 1.5 lacks; the "Print library floors" step records what
    # the resulting binary actually requires.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev curl xz-utils bzip2 ca-certificates git
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        run: |
          curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Stage the CEF distribution
        # Same constraint as the darwin job: no dist at build time means an
        # engine-less binary. Pin matches packages/nd/src/package/cef.ts.
        run: |
          mkdir -p "$HOME/.cache/nativedesktop/cef"
          curl -sL -o cef.tar.bz2 "https://cef-builds.spotifycdn.com/cef_binary_151.3.23%2Bgd211df0%2Bchromium-151.0.7922.170_linux64_minimal.tar.bz2"
          tar xjf cef.tar.bz2 -C "$HOME/.cache/nativedesktop/cef"
          mv "$HOME/.cache/nativedesktop/cef"/cef_binary_* "$HOME/.cache/nativedesktop/cef/151.3.23-linux64"
      - name: Build GTK host
        # A link failure mentioning glibc symbols here means the committed
        # vendor/libghostty-vt linux archive was built against a newer glibc
        # than this container, not a GTK problem.
        run: zig build
      - name: Strip + record sonames
        run: |
          strip zig-out/bin/nd-hello
          ldd zig-out/bin/nd-hello | tee nd-hello.ldd.txt
      - name: Require the chromium engine in the binary
        run: strings zig-out/bin/nd-hello | grep -q libcef
      - name: Print library floors (recorded in the release notes contract)
        run: dpkg-query -W libc6 libgtk-4-1 libadwaita-1-0 | tee nd-hello.floors.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nd-hello
          path: |
            zig-out/bin/nd-hello
            nd-hello.ldd.txt
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build-darwin-arm64, build-linux-x64]
    permissions:
      contents: write
      # The OIDC id_token is the publish credential, not an extra: npm's
      # lib/utils/oidc.js returns early unless ACTIONS_ID_TOKEN_REQUEST_URL and
      # ACTIONS_ID_TOKEN_REQUEST_TOKEN are set, and this permission is what sets
      # them. Each package must also list FormalSnake/NativeDesktop + the
      # workflow filename release.yml as its trusted publisher on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      # ubuntu-latest ships npm 10.9.8, which predates trusted publishing
      # entirely (no lib/utils/oidc.js at all) and so went straight to the
      # .npmrc token, which is what returned EOTP on the v0.1.1 tag.
      # Deliberately no registry-url: setup-node would then write an _authToken
      # line into .npmrc, restoring an auth path that survives a failed OIDC
      # exchange (actions/setup-node#1551).
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - uses: actions/download-artifact@v4
        with: { name: nd-shell, path: artifacts/darwin-arm64 }
      - uses: actions/download-artifact@v4
        with: { name: nd-hello, path: artifacts/linux-x64 }
      - name: Stage platform binaries
        run: |
          bun scripts/release/stage-platform-binary.ts darwin-arm64 artifacts/darwin-arm64/NDShell
          bun scripts/release/stage-platform-binary.ts linux-x64 artifacts/linux-x64/zig-out/bin/nd-hello
      - name: Check lockstep versions
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version packages/host/package.json)"
          fi
          bun scripts/release/check-versions.ts "$version"
      - name: bun install (bun publish resolves workspace:* from the lockfile)
        run: bun install --frozen-lockfile
      - name: Build @nativedesktop/react dist
        run: bun run --cwd packages/react build
      - name: Require an OIDC-capable npm and no registry credentials
        run: |
          npm install -g npm@latest
          version="$(npm -v)"
          echo "npm $version"
          if ! printf '11.5.1\n%s\n' "$version" | sort -V -C; then
            echo "FAIL: trusted publishing needs npm 11.5.1 or newer, got $version"
            exit 1
          fi
          # oidc.js is written never to throw: every failure path returns
          # undefined and leaves npm to publish with whatever credential is
          # still lying around. With none, a rejected exchange is ENEEDAUTH
          # instead of a quiet unsigned publish. grep -q so nothing is printed.
          for f in "$HOME/.npmrc" .npmrc; do
            if [ -f "$f" ] && grep -qE '_authToken|_auth *=|_password' "$f"; then
              echo "FAIL: $f carries registry credentials; OIDC must be the only auth"
              exit 1
            fi
          done
      - name: Publish all packages
        run: ./scripts/release/publish-all.sh
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
      - name: GitHub release with raw binaries (for Nix and non-npm consumers)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp artifacts/darwin-arm64/NDShell nd-shell
          cp artifacts/linux-x64/zig-out/bin/nd-hello nd-hello
          cp artifacts/linux-x64/nd-hello.ldd.txt .
          gh release create "$GITHUB_REF_NAME" nd-shell nd-hello nd-hello.ldd.txt NOTICE --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
