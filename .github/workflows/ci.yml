name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # .cargo/config.toml points build-dir at the macbook's external drive; runners build locally.
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target/build
  ND_ALLOW_LOCAL_BUILD: "1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
          - name: linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/build
      - name: fmt
        run: nix develop -c cargo fmt --all --check
      - name: clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: nd check on examples
        run: nix develop -c cargo run -p nd-cli -- check -p hello -p notes -p overrides -p places
      - name: docs (pages, links, prose, macOS captures, examples compile)
        if: matrix.name == 'macos'
        run: nix develop -c cargo run -p nd-cli -- docs check --require macos --compile
      - name: docs (pages, links, prose, examples compile, web embeds load)
        if: matrix.name == 'linux'
        run: nix develop -c cargo run -p nd-cli -- docs check --compile --web
      - name: nextest
        run: nix develop -c cargo nextest run --workspace --profile ci
      - name: keep golden mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: goldens-${{ matrix.name }}
          path: crates/*/tests/goldens/**/*.actual.png
          if-no-files-found: ignore
          retention-days: 7
      - name: doc tests
        run: nix develop -c cargo test --workspace --doc
