name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: native package headers in sync
        run: |
          cmp include/nd.h packages/native/include/nd.h && cmp include/nd_plugin.h packages/native/include/nd_plugin.h \
            || { echo "packages/native/include/ drifted from include/ — run scripts/sync-native-headers.sh"; exit 1; }
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: unit tests
        run: nix develop -c zig build test
      - name: codegen freshness
        run: |
          nix develop -c bun tools/codegen.ts
          git diff --exit-code -- schema packages/react/src/generated src/generated docs/widgets.md
      - name: build
        run: nix develop -c zig build
      - name: headless smoke
        run: nix develop -c ./scripts/headless-smoke.sh
      - name: headless m2
        run: nix develop -c ./scripts/headless-m2.sh
      - name: kill -9 crash isolation
        run: nix develop -c ./scripts/kill9-test.sh
      - name: bun install (workspace)
        run: nix develop -c bun install --frozen-lockfile
      - name: headless m3
        run: nix develop -c ./scripts/headless-m3.sh
      - name: headless m4
        run: nix develop -c ./scripts/headless-m4.sh
      - name: headless m5b
        run: nix develop -c ./scripts/headless-m5b.sh
      - name: headless m5c
        run: nix develop -c ./scripts/headless-m5c.sh
      - name: headless m8
        run: nix develop -c ./scripts/headless-m8.sh
      - name: bun tests (runtime)
        run: nix develop -c bun test runtime/ndp-binary.test.ts
      - name: build demo plugin
        run: nix develop -c zig build plugin-hello
      - name: headless m10 (binary bench + acl + plugins)
        run: nix develop -c ./scripts/headless-m10.sh
      - name: headless notes (native chrome)
        run: nix develop -c ./scripts/headless-notes.sh
