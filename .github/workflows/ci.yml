name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: unit tests
        run: nix develop -c zig build test
      - name: build
        run: nix develop -c zig build
      - name: headless smoke
        run: nix develop -c ./scripts/headless-smoke.sh
      - name: headless m2
        run: nix develop -c ./scripts/headless-m2.sh
      - name: kill -9 crash isolation
        run: nix develop -c ./scripts/kill9-test.sh
      - name: bun install (workspace)
        run: nix develop -c bun install --frozen-lockfile
      - name: headless m3
        run: nix develop -c ./scripts/headless-m3.sh
