[package]
name = "nd-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP bridge for driving a NativeDesktop app: execute, snapshot, reset."

[features]
default = ["stub"]
# An in-process stand-in driver over `examples/hello`'s retained tree, for use until
# `nd-automation` lands and the bridge can attach to a real host.
stub = ["dep:hello", "dep:nd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
hello = { path = "../../examples/hello", optional = true }
nd = { path = "../nd", features = ["test"], optional = true }

[[bin]]
name = "nd-mcp"
path = "src/main.rs"
