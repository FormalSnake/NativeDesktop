[package]
name = "nd-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Layered TOML settings, live reload, comment-preserving writes, Nix-managed detection, Store<T>, home-manager module generator."

[lib]
name = "nd_settings"

[[bin]]
name = "nd-hm-gen"
path = "src/bin/nd-hm-gen.rs"

[dependencies]
nd-settings-derive = { path = "../nd-settings-derive" }
notify = "8.2.0"
schemars = "1.2.3"
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
toml_edit = { version = "0.25.17", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
nd-plugin = { path = "../nd-plugin" }
tokio = { version = "1", features = ["rt"] }
