[package]
name = "nd-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd-core.workspace = true
interprocess = { version = "2.4.5", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "macros"] }
