[package]
name = "nd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nd-swift"

[features]
default = ["runtime"]
# The app vocabulary. An app's build script depends on `nd` with `default-features = false,
# features = ["build"]`, which keeps gpui out of the host build: every platform crate below is
# optional and comes in with `runtime`. Off macOS the GPUI backend arrives through the OS crate
# (`nd-os-linux`, `nd-os-windows`, `nd-os-web` re-export it); on macOS only `gpui` brings it, so
# AppKit apps never link `gpui_macos`. One dependency key cannot be optional per target.
runtime = ["dep:nd-core", "dep:nd-ui", "dep:nd-virtual", "dep:nd-diag", "dep:nd-gpui", "dep:nd-macros", "dep:nd-backend-appkit", "dep:nd-automation", "dep:nd-theme", "dep:nd-components", "dep:nd-icons", "dep:nd-settings", "dep:nd-update", "dep:nd-system", "dep:futures-channel", "dep:nd-os-linux", "dep:nd-os-windows", "dep:nd-os-web", "dep:serde", "dep:serde_json"]
build = ["dep:toml"]
# `settings_form::<T>()` over nd-settings' schema.
settings-ui = ["runtime", "nd-components/settings"]
test = ["runtime", "nd-ui/test-support", "dep:wasm-bindgen-test"]
# `nd::audit`, the tier 2 appearance audit: both backend kinds, the GPUI one headless.
audit = ["test", "gpui", "nd-gpui/platform", "nd-gpui/test-support", "dep:ndshell"]
# The GPUI backend on macOS as well, picked at launch with `ND_BACKEND=gpui`, for running the
# Linux and Windows backend on the macbook. Off by default: AppKit apps never link `gpui_macos`.
gpui = ["dep:nd-backend-gpui", "nd-terminal?/gpui", "nd-webview?/gpui"]
# `nd::terminal`: the libghostty-vt terminal widget (nd-terminal).
terminal = ["runtime", "dep:nd-terminal"]
# `nd::webview`: web pages in a window (nd-webview): WKWebView on macOS, Chromium on Linux, where
# no OS engine embeds in a GPUI window (nd-os-linux brings nd-cef).
webview = ["runtime", "dep:nd-webview", "nd-os-linux?/cef"]
# Chromium through CEF as a web engine on macOS too (nd-cef), picked with `[webview] engine =
# "cef"`. Off by default: a macOS app without it carries no Chromium bytes.
cef = ["webview", "dep:nd-cef"]
# gpui-fast in place of gpui-pre for the GPUI backend (`nd-gpui/fast`), measured against it on
# e1504g (docs/plan/baselines.md).
fast = ["runtime", "nd-gpui/fast"]

[dependencies]
nd-core = { workspace = true, optional = true }
nd-ui = { workspace = true, optional = true }
nd-diag = { workspace = true, optional = true }
nd-gpui = { workspace = true, optional = true }
nd-macros = { workspace = true, optional = true }
nd-automation = { workspace = true, optional = true, features = ["server"] }
nd-theme = { workspace = true, optional = true }
nd-components = { workspace = true, optional = true }
nd-icons = { workspace = true, optional = true }
nd-settings = { workspace = true, optional = true }
nd-virtual = { workspace = true, optional = true }
toml = { version = "0.9", optional = true }
nd-update = { workspace = true, optional = true, features = ["client"] }
nd-terminal = { workspace = true, optional = true }
nd-system = { workspace = true, optional = true }
futures-channel = { version = "0.3.34", optional = true }
nd-webview = { workspace = true, optional = true }
nd-cef = { workspace = true, optional = true }
# A Swift widget's props cross to Swift as JSON (`nd::native`).
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
nd = { path = ".", features = ["audit"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ndshell.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nd-backend-appkit = { workspace = true, optional = true }
nd-backend-gpui = { workspace = true, optional = true }
# The audit's AppKit variant holds the machine-wide window lock.
ndshell = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nd-os-linux = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
nd-os-windows = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nd-os-web = { workspace = true, optional = true }
# `#[nd::test]` runs tier 1 tests in a browser through it.
wasm-bindgen-test = { version = "0.3", optional = true }

# Tier 2 gate: a matugen `theme.json` write recolours a running app within 100 ms. AppKit owns
# the main thread, so libtest's harness is off.
[[test]]
name = "matugen_live"
harness = false

# Tier 2: every macOS chrome intent mapped to its system component, read back off AppKit.
[[test]]
name = "chrome"
harness = false

# Tier 2: every chrome intent through `nd::audit`, and the audit catching a view that breaks it.
[[test]]
name = "appearance"
harness = false

[[test]]
name = "appearance_catches"
harness = false

# Tier 2: an app-defined widget's objc2 view in a real window, and the drawn fallback.
[[test]]
name = "native_widget"
harness = false
