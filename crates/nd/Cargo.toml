[package]
name = "nd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nd-swift"

[features]
default = ["runtime"]
# The app vocabulary. An app's build script depends on `nd` with `default-features = false,
# features = ["build"]`, which keeps gpui out of the host build.
runtime = ["dep:nd-core", "dep:nd-ui", "dep:nd-diag", "dep:nd-gpui", "dep:nd-macros", "dep:nd-backend-appkit", "dep:nd-automation"]
build = ["dep:toml"]
# Placeholders for APIs later milestones ship; the examples that need them gate on their own
# milestone feature.
settings-ui = []
test = ["runtime", "nd-ui/test-support"]
# The GPUI backend on macOS as well, picked at launch with `ND_BACKEND=gpui`, for running the
# Linux and Windows backend on the macbook. Off by default: AppKit apps never link `gpui_macos`.
gpui = ["dep:nd-backend-gpui"]
# gpui-fast in place of gpui-pre for the GPUI backend (`nd-gpui/fast`), measured against it on
# e1504g (docs/plan/baselines.md).
fast = ["runtime", "nd-gpui/fast"]

[dependencies]
nd-core = { workspace = true, optional = true }
nd-ui = { workspace = true, optional = true }
nd-diag = { workspace = true, optional = true }
nd-gpui = { workspace = true, optional = true }
nd-macros = { workspace = true, optional = true }
nd-automation = { workspace = true, optional = true }
toml = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nd-backend-appkit = { workspace = true, optional = true }
nd-backend-gpui = { workspace = true, optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
nd-backend-gpui = { workspace = true }
