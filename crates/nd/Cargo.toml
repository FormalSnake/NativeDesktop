[package]
name = "nd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nd-swift"

[features]
default = ["runtime"]
# The app vocabulary. An app's build script depends on `nd` with `default-features = false,
# features = ["build"]`, which keeps gpui out of the host build.
runtime = ["dep:nd-core", "dep:nd-ui", "dep:nd-gpui", "dep:nd-macros", "dep:nd-backend-appkit", "dep:nd-automation"]
build = ["dep:toml"]

[dependencies]
nd-core = { workspace = true, optional = true }
nd-ui = { workspace = true, optional = true }
nd-gpui = { workspace = true, optional = true }
nd-macros = { workspace = true, optional = true }
nd-automation = { workspace = true, optional = true }
toml = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nd-backend-appkit = { workspace = true, optional = true }

# The design-target examples type-check against this crate until they move to `examples/`
# (M1): `cargo check -p nd --examples --features build`.
[[example]]
name = "hello"
path = "../../docs/plan/examples/hello/src/main.rs"
required-features = ["runtime"]

[[example]]
name = "hello-build"
path = "../../docs/plan/examples/hello/build.rs"
required-features = ["build"]
