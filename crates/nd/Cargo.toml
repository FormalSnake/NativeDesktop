[package]
name = "nd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nd-swift"

[features]
default = ["runtime"]
# The app vocabulary. An app's build script depends on `nd` with `default-features = false,
# features = ["build"]`, which keeps gpui out of the host build.
runtime = ["dep:nd-core", "dep:nd-ui", "dep:nd-diag", "dep:nd-gpui", "dep:nd-macros", "dep:nd-backend-appkit", "dep:nd-automation", "dep:nd-theme", "dep:nd-components"]
build = ["dep:toml"]
# Placeholders for APIs later milestones ship; the examples that need them gate on their own
# milestone feature.
settings-ui = []
test = ["runtime", "nd-ui/test-support"]

[dependencies]
nd-core = { workspace = true, optional = true }
nd-ui = { workspace = true, optional = true }
nd-diag = { workspace = true, optional = true }
nd-gpui = { workspace = true, optional = true }
nd-macros = { workspace = true, optional = true }
nd-automation = { workspace = true, optional = true }
nd-theme = { workspace = true, optional = true }
nd-components = { workspace = true, optional = true }
toml = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nd-backend-appkit = { workspace = true, optional = true }

# Tier 2 gate: a matugen `theme.json` write recolours a running app within 100 ms. AppKit owns
# the main thread, so libtest's harness is off.
[[test]]
name = "matugen_live"
harness = false
