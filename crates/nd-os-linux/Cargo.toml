[package]
name = "nd-os-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Chromium (nd-cef), the web engine of Linux web views. `nd`'s `webview` feature turns it on.
cef = ["dep:nd-cef"]

[dependencies]
nd-core.workspace = true
nd-ui.workspace = true
nd-gpui.workspace = true
nd-backend-gpui.workspace = true
nd-cef = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
ndshell.workspace = true
nd-test.workspace = true
# A fake print portal on the run's private bus (real_webview::real_print_cef).
zbus = "5.19"
