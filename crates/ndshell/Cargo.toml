[package]
name = "ndshell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"

# Headless Hyprland runner: IPC, virtual pointer and keyboard, output capture.
[target.'cfg(target_os = "linux")'.dependencies]
serde_json.workspace = true
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.8.0", default-features = false }
