[package]
name = "nd-os-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle = "0.6"

# The same windows-rs release gpui-pre-windows links, so one copy of the bindings ships.
# `nd` reaches the GPUI backend through this crate on Windows (lib.rs).
[target.'cfg(windows)'.dependencies]
nd-backend-gpui.workspace = true
nd-core.workspace = true
nd-gpui.workspace = true
nd-ui.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
ndshell.workspace = true
serde_json = "1.0.154"

# Tier 3: drives the real cursor through the Windows agent. Its test is
# `gate_m2_windows::real_resize_drag`, so only nextest's `real` and `gate` profiles run it.
[[test]]
name = "real_resize_gate"
harness = false
