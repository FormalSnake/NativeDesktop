[package]
name = "nd-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `settings_form::<T>()` over nd-settings' schema.
settings = ["dep:nd-settings", "dep:serde_json"]

[dependencies]
nd-settings = { path = "../nd-settings", optional = true }
serde_json = { workspace = true, optional = true }
nd-core.workspace = true
nd-icons.workspace = true
nd-gpui.workspace = true
nd-ui.workspace = true
nd-macros.workspace = true
nd-theme.workspace = true
serde.workspace = true
# The image pipeline decodes off the main thread at display size; GPUI already links it.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3.4"

# Images on the web come through the page's `fetch`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Response"] }

[dev-dependencies]
nd-ui = { workspace = true, features = ["test-support"] }
schemars = "1.2.3"
serde_json.workspace = true
tempfile = "3"
