[package]
name = "nd-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `settings_form::<T>()` over nd-settings' schema.
settings = ["dep:nd-settings", "dep:serde_json"]

[dependencies]
nd-settings = { path = "../nd-settings", optional = true }
serde_json = { workspace = true, optional = true }
nd-core.workspace = true
nd-gpui.workspace = true
nd-ui.workspace = true
nd-macros.workspace = true
nd-theme.workspace = true
serde.workspace = true

[dev-dependencies]
nd-ui = { workspace = true, features = ["test-support"] }
schemars = "1.2.3"
serde_json.workspace = true
tempfile = "3"
