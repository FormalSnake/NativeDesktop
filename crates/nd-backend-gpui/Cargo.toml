[package]
name = "nd-backend-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `Backend::capture` through GPUI's `render_to_image` (its test-support surface). Tier 2 tests and
# automation-heavy dev builds turn it on; release apps leave it off.
capture = ["nd-gpui/test-support"]

[dependencies]
nd-core.workspace = true
nd-gesture.workspace = true
nd-ui.workspace = true
nd-diag.workspace = true
nd-components.workspace = true
nd-icons.workspace = true
nd-theme.workspace = true
nd-virtual.workspace = true
nd-gpui = { workspace = true, features = ["platform"] }
futures = "0.3.34"
unicode-segmentation = "1.13.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
nd-gpui = { workspace = true, features = ["platform", "test-support"] }
nd-backend-gpui = { path = ".", features = ["capture"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
nd-virtual = { workspace = true, features = ["conformance"] }

[[test]]
name = "headless"
harness = false

# The overlay leak gate in-process (ARCHITECTURE.md 6.3): input inside an overlay never reaches
# the button or GPU surface under it.
[[test]]
name = "overlays"
harness = false

[[test]]
name = "forms"
harness = false

[[test]]
name = "nav"
harness = false

# Images, the seek bar, lyrics, the shelf, chat bubbles and avatars drawn on GPUI.
[[test]]
name = "media"
harness = false

# Splits, hidden subtrees, status pages, drawn alerts and the about panel.
[[test]]
name = "layout_widgets"
harness = false

# Tables, trees and grids on the GPUI presenter.
[[test]]
name = "list_kinds"
harness = false

# Row swipe actions on the GPUI presenter.
[[test]]
name = "row_actions"
harness = false

# The 100k-row scroll budget without a display.
[[test]]
name = "scroll_budget"
harness = false

# The list conformance suite on the GPUI presenter, in GPUI's headless app.
[[test]]
name = "virtual_list"
harness = false

# The web's single canvas, run natively in GPUI's headless app.
[[test]]
name = "single_canvas"
harness = false

# A file drop reaches `on_file_drop` with the window it landed on, in GPUI's headless app.
[[test]]
name = "file_drop"
harness = false

# Window tab groups and the drawn tab strip, in GPUI's headless app.
[[test]]
name = "window_tabs"
harness = false
