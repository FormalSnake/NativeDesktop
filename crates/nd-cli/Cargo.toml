[package]
name = "nd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The `nd` command: new, check, test, package, release."

[lib]
name = "nd_cli"

[[bin]]
name = "nd"
path = "src/main.rs"

[features]
default = ["capture"]
capture = ["dep:ndshell"]

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
nd-config.workspace = true
nd-update.workspace = true
rusty-s3 = "0.10"
tiny_http = "0.12"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
ureq = "3.4"
url = "2"
nd-core.workspace = true
nd-diag.workspace = true
nd-docs.workspace = true
# Only the wire protocol: `nd docs capture` drives examples over their automation socket.
nd-automation = { workspace = true, default-features = false }
# `nd docs capture`: the machine-wide window lock and composited window captures. Off for the
# Pages build of the docs site, whose image has no libxkbcommon.
ndshell = { workspace = true, optional = true }
clap = { version = "4", features = ["derive", "env"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[dev-dependencies]
nd-test.workspace = true
tempfile = "3"

# The Windows leg drives Setup.exe and the app through the agent in the desktop session.
[target.'cfg(windows)'.dev-dependencies]
ndshell.workspace = true
