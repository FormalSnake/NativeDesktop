[package]
name = "nd-diag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Tracy on demand, listening on localhost only (ARCHITECTURE.md 9.1).
tracy = ["dep:tracing-tracy"]

[dependencies]
nd-core.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crash-handler = "0.8.1"
libc = "0.2.190"
logroller = "0.1.12"
minidumper = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt", "env-filter"] }
tracing-tracy = { version = "0.12.0", optional = true, default-features = false, features = ["enable", "ondemand", "only-localhost"] }

[dev-dependencies]
tempfile = "3"
