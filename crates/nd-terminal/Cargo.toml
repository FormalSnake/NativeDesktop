[package]
name = "nd-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd-core.workspace = true
nd-ui.workspace = true
nd-theme.workspace = true
# libghostty-rs main: its sys crate pins a Ghostty commit that builds with Zig 0.16 (the dev
# shell's); the 0.2.2 release pins one that needs Zig 0.15, which cannot link on macOS 27.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb6", default-features = false }
portable-pty = "0.9.0"

[dev-dependencies]
nd-theme.workspace = true
