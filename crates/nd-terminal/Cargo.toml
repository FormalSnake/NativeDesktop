[package]
name = "nd-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd-core.workspace = true
nd-ui.workspace = true
nd-theme.workspace = true
# libghostty-rs main: its sys crate pins a Ghostty commit that builds with Zig 0.16 (the dev
# shell's); the 0.2.2 release pins one that needs Zig 0.15, which cannot link on macOS 27.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb6", default-features = false }
portable-pty = "0.9.0"
futures = "0.3.34"
swash = "0.2.10"

[features]
# The GPUI presenter on macOS too, for apps that run the GPUI backend there (`nd/gpui`).
gpui = ["dep:nd-backend-gpui", "dep:nd-gpui", "dep:image"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
nd-backend-gpui.workspace = true
nd-gpui.workspace = true
image = { version = "0.25.10", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nd-backend-appkit.workspace = true
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-metal = "0.3.2"
dispatch2 = "0.3.1"
nd-backend-gpui = { workspace = true, optional = true }
nd-gpui = { workspace = true, optional = true }
image = { version = "0.25.10", default-features = false, optional = true }

[dev-dependencies]
nd-theme.workspace = true
nd-gpui = { workspace = true, features = ["platform", "test-support"] }
nd-backend-gpui.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Tier 2 on the AppKit presenter's Metal renderer, offscreen.
[[test]]
name = "appkit"
harness = false

# The 100k-line scroll budget on each presenter this target links.
[[test]]
name = "scroll_budget"
harness = false

# Tier 2 on the GPUI presenter in GPUI's headless app.
[[test]]
name = "gpui"
harness = false
required-features = ["gpui"]
