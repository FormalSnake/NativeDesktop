# libghostty-vt-sys from libghostty-rs at d2036baeb6 (MIT OR Apache-2.0, LICENSE), patched in
# through the workspace's [patch] table. The one change is in build.rs, marked `nd:`.
[package]
name = "libghostty-vt-sys"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
links = "ghostty-vt"
build = "build.rs"
publish = false

[lib]
doctest = false

[features]
default = ["vendored"]
vendored = []
pkg-config = ["dep:pkg-config"]
link-dynamic = []
kitty-graphics = []

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
