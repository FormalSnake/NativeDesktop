[package]
name = "nd-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd-core.workspace = true
futures-channel = "0.3.34"
futures-core = "0.3.34"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[dev-dependencies]
futures-executor = "0.3.34"
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
# Keychain, the Secret Service over zbus (pure Rust crypto), Credential Manager.
keyring = "4.2.0"

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-user-notifications = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-media-toolbox", "AVAsset", "AVAssetTrack", "AVAudioMix", "AVMediaFormat", "AVPlayer", "AVPlayerItem"] }
objc2-media-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-audio-types", "objc2-core-media", "MTAudioProcessingTap"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMTime"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-media-player = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
mpris-server = "0.10.0"
libloading = "0.8.9"
png = "0.17"
zbus = "5.19"

[target.'cfg(windows)'.dependencies]
notify-rust = "4.18.2"
# The windows-rs release gpui-pre-windows and nd-os-windows link.
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "audio_playback"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Clipboard", "Navigator", "Window"] }

# Tier 2 on macOS: AppKit needs the main thread.
[[test]]
name = "mac_native"
harness = false

# Tier 2 on Linux, under `dbus-run-session`: one process, sequential legs.
[[test]]
name = "linux_native"
harness = false

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
ndshell.workspace = true
