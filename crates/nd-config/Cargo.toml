[package]
name = "nd-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The typed `nativedesktop.toml` and its JSON Schema."

[lib]
name = "nd_config"

[[bin]]
name = "nd-config"
path = "src/bin/nd-config.rs"

[dependencies]
base64 = "0.22"
schemars = "1.2.3"
serde.workspace = true
# preserve_order pinned here: gpui enables it workspace-wide, and generated schema files must not
# depend on which crates share the build.
serde_json = { workspace = true, features = ["preserve_order"] }
toml = "0.9"

[dev-dependencies]
