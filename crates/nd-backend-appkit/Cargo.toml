[package]
name = "nd-backend-appkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nd-swift-appkit"

[dependencies]
nd-core.workspace = true
nd-gesture.workspace = true
nd-ui.workspace = true
nd-gpui.workspace = true
nd-diag.workspace = true
nd-theme.workspace = true
nd-components.workspace = true
nd-icons.workspace = true
nd-virtual.workspace = true
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-quartz-core", "AVAnimation", "AVPlayer", "AVPlayerItem", "AVPlayerLayer"] }
objc2-core-media = "0.3.2"
objc2-web-kit = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"

[[test]]
name = "dispatch_spike"
harness = false

[[test]]
name = "backend_seam"
harness = false

[[test]]
name = "app_dispatch"
harness = false

# Tier 2: the forms family mapped to AppKit's own controls, with echo and reentrancy checks.
[[test]]
name = "forms"
harness = false

[[test]]
name = "nav_components"
harness = false

# Tier 2: tabs, split, status page and the scaffold inspector mapped to AppKit's own classes.
[[test]]
name = "layout_widgets"
harness = false

# Tier 2: native window tabs, held closes, cross-window view moves, alerts and the about panel.
[[test]]
name = "layout_windows"
harness = false

# Tier 2: the media family (images, seek bar, lyrics, shelf, chat, the composer's field).
[[test]]
name = "media"
harness = false

[[test]]
name = "port_gaps"
harness = false

# Tier 2: what the messages port needed after the port gaps (line clamp, icon, send button,
# video progress and seek, picture tails, panel and reaction fades).
[[test]]
name = "msg_gaps"
harness = false

# Tier 3: moves the real cursor. Its test is `gate_m0::real_resize_drag`, so only nextest's `real`
# and `gate` profiles run it; plain `cargo test` skips it unless ND_REAL=1.
[[test]]
name = "real_resize_gate"
harness = false

# Tier 3: the same gate with a WKWebView filling `examples/overlays` (`gate_m4_overlays::`).
[[test]]
name = "real_resize_webview_gate"
harness = false

# Tier 3: the same gate on `examples/browser`'s page, per engine (`gate_m8_webview::`).
[[test]]
name = "real_resize_wkwebview_gate"
harness = false

[[test]]
name = "real_resize_cef_gate"
harness = false

[[test]]
name = "real_resize_cef_chrome_gate"
harness = false

[[test]]
name = "real_extensions_cef_chrome_gate"
harness = false

[[test]]
name = "real_webstore_cef_chrome_gate"
harness = false

[[test]]
name = "virtual_list"
harness = false

# Tier 2: a file drop reaches `on_file_drop` with the window it landed on.
[[test]]
name = "file_drop"
harness = false

[[test]]
name = "scroll_view"
harness = false

[[test]]
name = "row_actions"
harness = false

[[test]]
name = "list_kinds"
harness = false

# Tier 3: a pinch and a page swipe through ndshell. `gate_m4::real_pinch_and_page_swipe`.
[[test]]
name = "real_gestures_gate"
harness = false

[dev-dependencies]
nd-gpui.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
nd-virtual = { workspace = true, features = ["conformance"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3.1"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
ndshell.workspace = true
objc2-screen-capture-kit = "0.3.2"
