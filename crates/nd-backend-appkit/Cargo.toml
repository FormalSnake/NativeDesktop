[package]
name = "nd-backend-appkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nd-swift-appkit"

[dependencies]
nd-core.workspace = true
nd-ui.workspace = true
nd-diag.workspace = true
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"

[[test]]
name = "dispatch_spike"
harness = false

[[test]]
name = "backend_seam"
harness = false

# Tier 3: moves the real cursor. Its test is `gate_m0::real_resize_drag`, so only nextest's `real`
# and `gate` profiles run it; plain `cargo test` skips it unless ND_REAL=1.
[[test]]
name = "real_resize_gate"
harness = false

[dev-dependencies]
nd-gpui.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3.1"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
ndshell.workspace = true
objc2-screen-capture-kit = "0.3.2"
