[store]
dir = "target/nextest"

# Tier 3 tests post real HID events and take over focus, so they run one at a time. Their last
# path segment starts with `real_` or they live in a `real` module (`tests/real.rs`), so a gate
# test such as `gate_m0::real_resize_drag` is tier 3 too. On Linux each tier 3 test runs its own
# headless Hyprland with its own seat (`ndshell::hyprland`), so there they stay parallel.
[test-groups.real-window]
max-threads = 1

# Tier 1 (logic, TestBackend) and tier 2 (in-process backends) run in parallel; every test is its
# own process. Default profile for local runs: everything except tier 3.
[profile.default]
default-filter = "not test(/(^|::)(real::|real_)/) and not test(/^gate_m1::nd_new_builds/)"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
platform = 'cfg(not(target_os = "linux"))'
filter = "test(/(^|::)(real::|real_)/)"
test-group = "real-window"
slow-timeout = { period = "60s", terminate-after = 4 }

# Every test that holds the machine-wide window lock (`ndshell::lock::window_test`): AppKit
# windows that must stay key, panels and alerts, screen captures. The group orders them inside
# one run and the lock orders them against runs in other worktrees. Keep the two in step: a
# window test missing here takes a parallel slot and parks on the lock, and a test here that
# never takes the lock queues for nothing. The matugen recolour timing queues too, since a
# loaded machine would push it past its 100 ms budget.
[[profile.default.overrides]]
filter = "(package(nd-backend-appkit) - binary(native_mappings_lint)) | (binary(/^appearance/) & test(=appearance_audit::appkit)) | binary_id(chrome::settings) | binary_id(nd::chrome) | binary_id(nd::matugen_live) | binary_id(overrides::goldens) | binary_id(/^gallery::(goldens|forms_goldens|media_goldens|audio)$/) | binary_id(tabs::window_tabs) | binary_id(terminal::window) | binary_id(nd-system::mac_native)"
test-group = "real-window"
# Waiting for the machine lock (up to 600 s) counts against the test, so these get room for it.
slow-timeout = { period = "60s", terminate-after = 15 }

# Tiers 1 and 2 only, what `just test` and CI's first step run.
[profile.fast]
inherits = "default"
fail-fast = true

# CI: all tiers that the runner can host, retries off so flakes show up.
[profile.ci]
inherits = "default"
retries = 0
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Tier 3 only, for machines with a window server: `cargo nextest run --profile real`.
[profile.real]
default-filter = "test(/(^|::)(real::|real_)/)"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.real.overrides]]
platform = 'cfg(not(target_os = "linux"))'
filter = "all()"
test-group = "real-window"

# `just gate mN` runs `cargo nextest run --profile gate -E 'test(/^gate_mN::/)'`. Gate tests span
# tiers 1 to 3, so the default tier filter is lifted and the real-window group still serializes.
[profile.gate]
default-filter = "all()"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 15 }

# The dispatch spike and the other key-window tests need their window key, which a real-input
# test activating its own app takes away, so they queue with them.
[[profile.gate.overrides]]
platform = 'cfg(not(target_os = "linux"))'
filter = "test(/(^|::)(real::|real_)/) | (package(nd-backend-appkit) - binary(native_mappings_lint)) | (binary(/^appearance/) & test(=appearance_audit::appkit)) | binary_id(chrome::settings) | binary_id(nd::chrome) | binary_id(nd::matugen_live) | binary_id(overrides::goldens) | binary_id(/^gallery::(goldens|forms_goldens|media_goldens|audio)$/) | binary_id(tabs::window_tabs) | binary_id(terminal::window) | binary_id(nd-system::mac_native)"
test-group = "real-window"

# The M10 flow builds and packs an app three times (release profile, one cold), so it gets room.
[[profile.gate.overrides]]
filter = "test(/^gate_m10::real_/)"
slow-timeout = { period = "300s", terminate-after = 4 }

# `nd new` compiles a whole app from cold, so its gate gets room and stays out of the default run.
[[profile.gate.overrides]]
filter = "test(/^gate_m1::nd_new_builds/)"
slow-timeout = { period = "300s", terminate-after = 4 }
