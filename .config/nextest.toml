[store]
dir = "target/nextest"

# Tier 3 tests post real HID events and take over focus, so they run one at a time. Their last
# path segment starts with `real_` or they live in a `real` module (`tests/real.rs`), so a gate
# test such as `gate_m0::real_resize_drag` is tier 3 too. On Linux each tier 3 test runs its own
# headless Hyprland with its own seat (`ndshell::hyprland`), so there they stay parallel.
[test-groups.real-window]
max-threads = 1

# Tier 1 (logic, TestBackend) and tier 2 (in-process backends) run in parallel; every test is its
# own process. Default profile for local runs: everything except tier 3.
[profile.default]
default-filter = "not test(/(^|::)(real::|real_)/) and not test(/^gate_m1::nd_new_builds/)"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
platform = 'cfg(not(target_os = "linux"))'
filter = "test(/(^|::)(real::|real_)/)"
test-group = "real-window"
slow-timeout = { period = "60s", terminate-after = 4 }

# Tiers 1 and 2 only, what `just test` and CI's first step run.
[profile.fast]
inherits = "default"
fail-fast = true

# CI: all tiers that the runner can host, retries off so flakes show up.
[profile.ci]
inherits = "default"
retries = 0
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Tier 3 only, for machines with a window server: `cargo nextest run --profile real`.
[profile.real]
default-filter = "test(/(^|::)(real::|real_)/)"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.real.overrides]]
platform = 'cfg(not(target_os = "linux"))'
filter = "all()"
test-group = "real-window"

# `just gate mN` runs `cargo nextest run --profile gate -E 'test(/^gate_mN::/)'`. Gate tests span
# tiers 1 to 3, so the default tier filter is lifted and the real-window group still serializes.
[profile.gate]
default-filter = "all()"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# The dispatch spike needs its window key, which a real-input test activating its own app takes
# away, so it queues with them.
[[profile.gate.overrides]]
platform = 'cfg(not(target_os = "linux"))'
filter = "test(/(^|::)(real::|real_)/) | binary(dispatch_spike)"
test-group = "real-window"

# `nd new` compiles a whole app from cold, so its gate gets room and stays out of the default run.
[[profile.gate.overrides]]
filter = "test(/^gate_m1::nd_new_builds/)"
slow-timeout = { period = "300s", terminate-after = 4 }
