[package]
name = "places"
version = "0.1.0"
edition = "2024"

[dependencies]
nd = "0.1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-map-kit = { version = "0.3", features = ["MKMapView", "MKPointAnnotation", "MKGeometry", "MKAnnotation"] }
objc2-core-location = { version = "0.3", features = ["CLLocation"] }

[build-dependencies]
nd = { version = "0.1", default-features = false, features = ["build"] }
