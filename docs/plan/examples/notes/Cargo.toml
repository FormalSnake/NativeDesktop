[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[dependencies]
nd = { version = "0.1", features = ["settings-ui"] }
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["serde", "js"] }

[dev-dependencies]
nd = { version = "0.1", features = ["test"] }

[build-dependencies]
nd = { version = "0.1", default-features = false, features = ["build"] }
