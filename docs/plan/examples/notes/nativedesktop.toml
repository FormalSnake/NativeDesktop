#:schema ../../target/nd/nativedesktop.schema.json
[app]
id = "es.canarycoders.notes"
display_name = "Notes"
icon = "assets/icon.icon"
categories = ["Office", "Utility"]
url_schemes = ["notes"]

[[app.file_associations]]
ext = ["md"]
role = "editor"

[updates]
feed = "https://updates.canarycoders.es/notes"
channels = ["stable", "beta"]
public_key = "RWQf6LRCGA9i5zm4Yq0l3z7u0n3f2Xk3t8jW6dYp6Z2b0x8c4Kq1e9s"

[diagnostics]
sentry_dsn_env = "NOTES_SENTRY_DSN"   # optional upload; bundles are always written locally

[macos]
minimum_system_version = "14.0"
signing_identity = "Developer ID Application: CanaryCoders"
notarize = true

[windows]
publisher = "CanaryCoders"
installer = { splash = "assets/splash.png", shortcuts = ["start", "desktop"] }
signing = "azure"

[linux]
formats = ["appimage"]
