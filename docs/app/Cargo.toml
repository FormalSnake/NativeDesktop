[package]
name = "nd-docs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The NativeDesktop docs, as an nd app: native on the desktop, the docs site on the web."

[features]
