[package]
name = "nd-docs-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The docs site's live examples: one wasm bundle that runs the example named in its URL."

[dependencies]
nd = { path = "../../crates/nd" }
hello = { path = "../../examples/hello" }
gallery = { path = "../../examples/gallery" }
overrides = { path = "../../examples/overrides" }
scroll-bench = { path = "../../examples/scroll" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Location", "Window"] }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[[bin]]
name = "nd-docs-run"
path = "src/main.rs"
