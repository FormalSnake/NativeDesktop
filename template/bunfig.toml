# Pin the classic hoisted layout so a scaffolded app's `bun install` never
# flips to Bun 1.3+'s isolated (pnpm-style) linker. See the root
# bunfig.toml in the NativeDesktop repo for why that default is unsafe here:
# it can leave a `file:`/`link:`-referenced package (e.g. a local
# @nativedesktop/react checkout during framework development) without its
# own transitive deps on disk, and the host's Bun child can't resolve them.
[install]
linker = "hoisted"
