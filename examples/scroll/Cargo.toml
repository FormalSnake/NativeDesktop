[package]
name = "scroll-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The GPUI backend on macOS, picked with `ND_BACKEND=gpui`.
gpui = ["nd/gpui"]

[dependencies]
nd = { path = "../../crates/nd" }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }
