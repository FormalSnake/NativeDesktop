[package]
name = "notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The example needs APIs that ship in M6 (components) and M7 (settings). Without the feature the
# crate is empty, so the workspace builds; CI turns it on once the milestone lands.
m6 = []

[dependencies]
nd = { path = "../../crates/nd", features = ["settings-ui"] }
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["serde", "js"] }

[dev-dependencies]
nd = { path = "../../crates/nd", features = ["test"] }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[[bin]]
name = "notes"
path = "src/main.rs"
required-features = ["m6"]

[[test]]
name = "notes"
path = "tests/notes.rs"
required-features = ["m6"]
