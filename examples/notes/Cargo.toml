[package]
name = "notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd = { path = "../../crates/nd", features = ["settings-ui"] }
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["serde", "js"] }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[[bin]]
name = "notes"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
nd = { path = "../../crates/nd", features = ["audit"] }
nd-test = { path = "../../crates/nd-test" }
tempfile = "3"

# Tier 1 runs in a browser too; the tier 2 audit and the locator tests stay native.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
nd = { path = "../../crates/nd", features = ["test"] }

[[test]]
name = "notes"
path = "tests/notes.rs"

# Tier 2: the appearance audit (`nd::audit`) over the window, light, dark and matugen.
[[test]]
name = "appearance"
harness = false
