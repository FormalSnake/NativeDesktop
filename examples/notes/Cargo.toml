[package]
name = "notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Without the feature the crate is empty.
m6 = []

[dependencies]
nd = { path = "../../crates/nd", features = ["settings-ui"] }
# `#[derive(Settings)]` expands to `::nd_settings` paths, and settings and action payloads derive
# `JsonSchema`, neither of which `nd` re-exports.
nd-settings = { path = "../../crates/nd-settings" }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["serde", "js"] }

[dev-dependencies]
nd = { path = "../../crates/nd", features = ["test"] }
tempfile = "3"

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[[bin]]
name = "notes"
path = "src/main.rs"
required-features = ["m6"]

[[test]]
name = "notes"
path = "tests/notes.rs"
required-features = ["m6"]
