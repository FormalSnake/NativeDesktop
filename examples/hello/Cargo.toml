[package]
name = "hello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The GPUI backend on macOS, picked with `ND_BACKEND=gpui`.
gpui = ["nd/gpui"]

[dependencies]
nd = { path = "../../crates/nd" }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[dev-dependencies]
nd = { path = "../../crates/nd", features = ["audit"] }
nd-cli = { path = "../../crates/nd-cli" }
serde_json = "1.0.154"
tempfile = "3"

# Tier 2: the appearance audit (`nd::audit`) over every window, light, dark and matugen.
[[test]]
name = "appearance"
harness = false
