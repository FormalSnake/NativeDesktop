[package]
name = "overrides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd = { path = "../../crates/nd" }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[[bin]]
name = "overrides"
path = "src/main.rs"

[dev-dependencies]
png = "0.17"

# Tier 2 goldens of the macOS look. AppKit owns the main thread, so libtest's harness is off.
[[test]]
name = "goldens"
harness = false
