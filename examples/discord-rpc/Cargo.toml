[package]
name = "discord-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Discord Rich Presence as an nd plugin, written the way a third-party crate would."

# Only the public plugin and ipc crates: no access to framework internals.
[dependencies]
nd-plugin = { path = "../../crates/nd-plugin" }
nd-ipc = { path = "../../crates/nd-ipc" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "macros", "signal"] }
toml = "0.9"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "macros", "net"] }
