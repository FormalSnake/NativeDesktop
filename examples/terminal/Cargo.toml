[package]
name = "terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The GPUI backend on macOS, picked with `ND_BACKEND=gpui`.
gpui = ["nd/gpui"]

[dependencies]
nd = { path = "../../crates/nd", features = ["terminal"] }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[dev-dependencies]
nd = { path = "../../crates/nd", features = ["audit", "terminal"] }
ndshell.workspace = true
nd-ui.workspace = true

# Tier 2: the appearance audit (`nd::audit`) over the window, light, dark and matugen.
[[test]]
name = "appearance"
harness = false

# Tier 2: the AppKit view in a real window: keys typed through AppKit reach `cat` and echo back.
[[test]]
name = "window"
harness = false
