[package]
name = "gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nd = { path = "../../crates/nd" }

[build-dependencies]
nd = { path = "../../crates/nd", default-features = false, features = ["build"] }

[[bin]]
name = "gallery"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
nd = { path = "../../crates/nd", features = ["audit"] }

# Tier 1 runs in a browser too; the tier 2 audit and the CLI stay native.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
nd = { path = "../../crates/nd", features = ["test"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ndshell = { path = "../../crates/ndshell" }
png = "0.17"

# Tier 2 goldens of the macOS look. AppKit owns the main thread, so libtest's harness is off.
[[test]]
name = "goldens"
harness = false

# Tier 2 goldens of the forms page on macOS.
[[test]]
name = "forms_goldens"
harness = false

# Tier 2: the appearance audit (`nd::audit`) over every window, light, dark and matugen.
[[test]]
name = "appearance"
harness = false
